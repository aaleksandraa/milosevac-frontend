# Plesk → Domains → milosevac.com → Apache & nginx Settings → Additional nginx directives
# Use this only if nginx handles the request before Apache and ignores public/.htaccess.
# The rewrite stays on milosevac.com. Do not send crawlers to api.milosevac.com.

if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|LinkedInBot|WhatsApp|Slackbot|TelegramBot|Viber|Discordbot|Pinterestbot|Googlebot|bingbot|Applebot|Embedly|SkypeUriPreview|redditbot)") {
    rewrite ^/(clanak|fk-posavina|prekidi-struje|vrijeme|kontakt|omilosevcu|kategorija)(/.*)?$ /social-preview.php last;
}
